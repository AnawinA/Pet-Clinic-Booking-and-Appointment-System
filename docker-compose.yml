name: petcare

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petcare}:${POSTGRES_PASSWORD:-petcare}@postgres:5432/${POSTGRES_DB:-petcare}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  PHOTO_DIR: ${PHOTO_DIR:-/data/pet-photos}

x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: petcare-backend:local
  restart: unless-stopped
  labels:
    autoheal: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcare}
      POSTGRES_DB: ${POSTGRES_DB:-petcare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petcare} -d ${POSTGRES_DB:-petcare}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    labels: {}

  web1:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      INSTANCE_ID: web1
    volumes:
      - petphotos:/data/pet-photos
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web2:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      INSTANCE_ID: web2
    volumes:
      - petphotos:/data/pet-photos
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.outbox_worker"]
    environment:
      <<: *backend-env
      INSTANCE_ID: worker
      HEARTBEAT_FILE: /tmp/petcare-worker-heartbeat
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; p=os.environ.get('HEARTBEAT_FILE','/tmp/petcare-worker-heartbeat'); assert os.path.exists(p) and time.time()-os.path.getmtime(p) < 30\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: petcare-nginx:local
    restart: unless-stopped
    labels:
      autoheal: "true"
    ports:
      - "80:80"
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - web1
      - web2

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  promdata:
  grafanadata:
  petphotos:
